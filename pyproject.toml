[project]
name = "camp-fi"
version = "0.1.0"
description = "Daemon for IIITK captive portal authentication"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "keyring>=24.0.0",
    "platformdirs>=3.10.0",
    "typer>=0.9.0",
]

[project.scripts]
camp-fi = "camp_fi.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
]
